# Legacy native VPS configuration. The shared Docker runtime uses docker/nginx.conf.
server {
    listen 80;
    server_name _;

    root /var/www/videokur/frontend;
    index dashboard.php index.php index.html;

    client_max_body_size 512M;

    location / {
        try_files $uri $uri/ /dashboard.php;
    }

    location ^~ /api/ {
        root /var/www/videokur;
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /output/ {
        alias /var/www/videokur/output/;
        add_header X-Content-Type-Options nosniff;
        types {
            video/mp4 mp4;
            audio/mpeg mp3;
            image/png png;
            image/jpeg jpg jpeg;
            application/json json;
            text/plain srt txt;
        }
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param DOCUMENT_ROOT /var/www/videokur;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /(data|python|docs|deploy|yedek|Fikirler)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
