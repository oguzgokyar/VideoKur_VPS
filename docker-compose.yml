services:
  app:
    build:
      context: .
    container_name: videokur_app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/check.php') === false ? 1 : 0);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  production-scheduler:
    build:
      context: .
    container_name: videokur_production_scheduler
    command: ["python", "python/scheduler/production_scheduler.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    profiles:
      - schedulers

  social-scheduler:
    build:
      context: .
    container_name: videokur_social_scheduler
    command: ["python", "python/scheduler/social_scheduler.py", "--interval", "${SOCIAL_SCHEDULER_INTERVAL:-60}"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    profiles:
      - schedulers

  content-scheduler:
    build:
      context: .
    container_name: videokur_content_scheduler
    command: ["python", "python/content/scheduler.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    profiles:
      - schedulers
