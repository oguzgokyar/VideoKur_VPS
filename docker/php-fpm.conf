[www]
clear_env = no
env[PATH] = /opt/videokur-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[PYTHON_BIN] = /opt/videokur-venv/bin/python
env[FFMPEG_BIN] = /usr/bin/ffmpeg
env[DATA_DIR] = /app/data
env[OUTPUT_DIR] = /app/output
env[LOG_DIR] = /app/logs
catch_workers_output = yes
